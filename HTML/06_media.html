<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Elements</title>
</head>
<body>
    <h1>Media Elements</h1>
    <h2>Images</h2>
    <figure>
        <img src="image.jpg" alt="Description of image">
        <figcaption>Caption for the image</figcaption>
    </figure>
    <h2>Videos</h2>
    <figure>
        <video controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <figcaption>Caption for the video</figcaption>
    </figure>
    <h2>Audio</h2>
    <figure>
        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>
        <figcaption>Caption for the audio</figcaption>
    </figure>
    
</body>
</html>

<!-- The <figure> tag is used to encapsulate self-contained content, typically images, diagrams, illustrations, or code snippets, along with their caption (using <figcaption>). Here's a detailed explanation:

Primary Purpose
Groups media content with its caption
Creates a semantic relationship between content and its description
Self-contained unit that can be referenced as a single unit

What Can Go Inside <figure>
Images (<img>)
Videos (<video>)
Audio (<audio>)
Diagrams
Code snippets (<pre>, <code>)
Charts/graphs
Tables
Quotations
Text -->
