<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
        <label for="name">Name:
        <input type="text" id="name" name="name" placeholder="Enter your name">
        </label>
        <br><br>
        <label for = "email">Email:</label>
        <input type = "text" id = "email" name = "email" placeholder = "Enter your email">
        <br><br>
        <label for ="password">Password:</label>
        <input type = "password" id = "password" name = "password" placeholder ="enter your password">
        <br><br>
        <label for="gender">Gender:</label>
        <input type ="radio" id ="male" name="gender" value="male">Male
        <input type ="radio" id ="female" name="gender" value="female"> Female
        <br><br>
        <label for="country">Country:
        <select id="country" name="country">
            <option value="India">INDIA</option>
            <option value="canada">Canada</option>
            <option value="uk">UK</option>
        </select>
        </label>
        <br><br>

        <label for="Date">Date:
        <input type="date" id="Date" name="Date">
        </label>
        <input type = "reset" value="RESET">
        <button type="reset">RESET</button>
        <input type="submit" value="SUBMIT">
    </form>

    <h2>Progress Bar Example</h2>
    <label for="progress">Download Progress:</label>
    <progress id="progress" value="70" max="100">70%</progress>
    <span>70% Complete</span>
</body>
</html>

<!-- Here, the <span> is used to:

Add supplementary text next to the progress bar
Keep the text "70% Complete" inline with the progress bar
Allow for potential styling or JavaScript updates of just that text
Key characteristics of <span>:

Inline element: Doesn't create line breaks
Generic container: No semantic meaning by itself
Minimal impact: No visual change without styling
Flexible: Can be used anywhere in text
Light: Adds no default formatting
Common use cases:

Applying styles to part of text
Creating hooks for JavaScript
Adding language markers
Custom attributes for specific parts
Grouping inline elements
Example with multiple uses: -->
