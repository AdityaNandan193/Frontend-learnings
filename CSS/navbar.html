<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar variations</title>
    <style>
        .nav-container{
            margin : 20px;  
            padding : 20px;
        }
        .nav1{
        border : 2px solid black;
        background-color: lightgreen;
        padding : 10px;
        }
        .nav1 ul{
            list-style-type: none; /* to remove bullet points */
            display : flex; /* to make it horizontal */
            gap: 20px; /* to add space between items */
            padding: 0; /* to remove default padding */ 
            margin: 0; /* to remove default margin */
            justify-content: center; /* to center the items */
        }
        .nav1 li {
             display : inline; /* to make it horizontal */
        }
        .nav1 a{
            text-decoration : none; /* to remove underline */
            color : black;
            font-weight : bold;
            background-color: lightpink;
            padding : 5px 10px;   
        }
        .nav1 .login-button{
            background-color: orange;
            border : none; 
            padding : 5px 10px;     
            /* this padding is to give space inside the button and it is 
            5px top and bottom, 10px left and right */
            font-weight : bold;
            border-radius: 5px; /* to give rounded corners */
            cursor : pointer; /*  this is to change cursor to pointer on hover */
        }
        .nav1 a:hover::after{
                /* it is used to do any styling after hover */
                content: ""; /* this is used to give content */
        }
        .nav1 a::after{  
            /* this is used to apply styles after the link and we have to first give the content */
            content: "abc"; 
         }
    
    </style>
    
</head>
<body>
     <div class = "nav-container">
        <h2>Variation 1 : Horizontal with underline effect</h2>
        <nav class = "nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Product</a></li>
                <li><button class = "login-button">Login</button></li>
            </ul>
        </nav>
     </div>
     <div class = "nav-container">
        <h2>Variation 2 : Vertical with hover effect</h2>
        <nav class = "nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Product</a></li>
                <li><button>Login</button></li>
            </ul>
        </nav>
        </div>
        <div class = "nav-container">
            <h2>Variation 3 : Horizontal with dropdown</h2>
            <nav class = "nav3">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Product</a></li>
                    <li><button>Login</button></li>
                </ul>
            </nav>
        </div>

</body>
</html>
