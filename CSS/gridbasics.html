<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid introduction</title>
    <style>

        .grid-container {
            display : grid;
            /* grid-template-columns: repeat(3, 1fr); 
            grid-template-rows: repeat(, 100px); */
            /* This repeat is used for creating equal-sized columns and rows and in 
            its bracket we define the size of each column and row , so this 3 is
            the number of columns and 2 is the number of rows similarly 2 is 
            the height of each row and 100 px is the width of each column
            */
            grid-template-columns: 1fr 1fr 1fr 1fr;
            grid-template-rows : 100px 100px;
            gap : 1px;
        }
        .item {
            background-color: lightblue;
            border: 3px solid #000;
            padding: 20px;
            font-size: 30px;
            text-align: center;
            color : black;
            gap : 20px;
        }
        /* .item-1{
           
            grid-column: 1 / 3;
            /*actually this means that the item-1 will start from column line 1 and
            will end at column line 3 , so it will span across 2 columns */
            /* grid-row : 1/3; */
            /* similarly this means that the item-1 will start from row line 1 and
            will end at row line 3 , so it will span across 2 rows 
        } */
        /* .item-2{
            grid-row : 1 /3;
            
        } */ 
         .item-1{
            grid-column : 1/span 2;
            grid-row : 1 / span 2;
            
         }
         .item-2{
            grid-column : 3 / span 2;
            grid-row : 1 / span 2;
         }


       
    </style>
</head>
<body>
    <div class="grid-container">
        <div  class = "item item-1">1</div>
        <div   class = "item item-2">2</div>
        <div class="item" class = "item-3">3</div>
        <div class="item" class = "item-4">4</div>
        <div class="item" class = "item-5">5</div>
        <div class="item" class = "item-6">6</div>
    </div>
</body>
</html>
