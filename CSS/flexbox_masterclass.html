<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>everthing about flexbox</title>
    <style>
       body{
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: lightgray;
       }
       .flex-box{
        border : 2px solid black;
        background-color: white;
        padding : 30px;
        margin-bottom : 30px;
        
       }
       .container1{
        display : flex;
       }
         .container2{
          display : flex;
          /* i.e by default flex-direction: row; */
          flex-direction: column;
         }
         .container3{
            display :flex;
            justify-content : space-between;
         }
         .container4{
            display : flex;
            height : 200px;
            align-items : center;
         }
         .container5{
            display : flex;
            flex-wrap : wrap;
    
         }
       .item{
        padding : 10px;
        background-color : lightblue;
        margin : 5px;
        width : 20px;
        height : 20px;
        border-radius : 50%;
        display : flex;
        align-items : center; 
        /* it centers the items vertically from top to bottom */
        justify-content: center;
        /* it centers the items horizontally from left to right */
        margin-bottom : 5px;
       }
      

    </style>
</head>
<body>
        <h1>Everthing about flexbox</h1>
        <div class = "flex-box">
            <h2> 1. Default Flex (row)</h2>
            <div class = "container1">
            <div class = "item" style = "background-color: pink">1</div>
            <div class = "item" style = "background-color: lightgreen">2</div>
            <div class = "item" style = "background-color: lightcoral">3</div>
            <div class = "item" style = "background-color: lightsalmon">4</div>
            <div class = "item" style = "background-color: lightblue">5</div>
            </div>
        </div>

         <div class = "flex-box">
            <h2> 2. Flex Direction : Column</h2>
            <div class = "container2">
            <div class = "item" style = "background-color: pink">1</div>
            <div class = "item" style = "background-color: lightgreen">2</div>
            <div class = "item" style = "background-color: lightcoral">3</div>
            <div class = "item" style = "background-color: lightsalmon">4</div>
            <div class = "item" style = "background-color: lightblue">5</div>
            </div>
        </div>

        <div class = "flex-box">
            <h2> 3. Justify Content : Space-Between</h2>
            <div class = "container3">
            <div class = "item" style = "background-color: pink">1</div>
            <div class = "item" style = "background-color: lightgreen">2</div>
            <div class = "item" style = "background-color: lightcoral">3</div>
            <div class = "item" style = "background-color: lightsalmon">4</div>
            <div class = "item" style = "background-color: lightblue">5</div>
            </div>
        </div>

        <div class = "flex-box">
            <h2> 4. Align Items : Center</h2>
            <div class = "container4">
            <div class = "item" style = "background-color: pink">1</div>
            <div class = "item" style = "background-color: lightgreen">2</div>
            <div class = "item" style = "background-color: lightcoral">3</div>
            <div class = "item" style = "background-color: lightsalmon">4</div>
            <div class = "item" style = "background-color: lightblue">5</div>
            </div>
        </div>

        <div class = "flex-box">
            <h2> 5. Flex Wrap : Wrap</h2>
            <div class = "container5">
            <div class = "item" style = "background-color: pink">1</div>
            <div class = "item" style = "background-color: lightgreen">2</div>
            <div class = "item" style = "background-color: lightcoral">3</div>
            <div class = "item" style = "background-color: lightsalmon">4</div>
            <div class = "item" style = "background-color: lightblue">5</div>
            <div class = "item" style = "background-color: pink">6</div>
            <div class = "item" style = "background-color: lightgreen">7</div>
            <div class = "item" style = "background-color: lightcoral">8</div>
            <div class = "item" style = "background-color: lightsalmon">9</div>
            <div class = "item" style = "background-color: lightblue">10</div>
        </div>
        </div>
</body>
</html>
