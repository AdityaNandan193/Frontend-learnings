<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class = "bg-stone-50  flex justify-center items-center h-screen ">
    <div class = "   text-center align-middle text-white pt-4 border-2 border-white m-40 p-10 rounded-lg bg-black shadow-lg shadow-black">
        <h1 class="mb-4 font-bold font-serif">LOGIN</h1>
        <form>
            <div>
                <label for="email" class ="flex text-left">Email:</label>
                <input class = " block w-full border-2 border-white bg-neutral-700 text-white p-2 rounded" type="email" id = "email" placeholder = "enter your email">
            </div>
            <div class = "mt-4">
                <label for="password" class ="flex text-left">Password:</label>
                <input class = "block w-full border-2 border-white bg-neutral-700 text-white p-2 rounded" type="password" id = "password" placeholder = "enter your password">
            </div>
            <button class = " w-full bg-cyan-500 text-white py-2 px-4 rounded mt-6 hover:bg-blue-600" type = "submit">Login</button>
        </form>
    </div>
</body>
</html>
